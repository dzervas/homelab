name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker.yaml
      - docker/**

permissions:
  contents: read

concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  # Build on native amd64/arm64 runners and merge digests after both succeed.
  publish:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - affine
          - openclaw
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: docker/${{ matrix.image }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}
      meta-images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=build-${{ github.run_number }}
        type=sha
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
