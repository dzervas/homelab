# /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: kube-system
spec:
  valuesContent: |-
    nodelocal:
      enabled: true

    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: view
            parameters: vpn-clients
            configBlock: |-
              expr incidr(client_ip(), '10.50.50.0/24')
          - name: template
            parameters: IN A kube.vpn.dzerv.art
            configBlock: |-
              match ^kube\.vpn\.dzerv\.art\.$
              answer "{{ .Name }} 60 IN A 10.43.0.1"
              fallthrough
          - name: template
            parameters: IN A vpn.dzerv.art
            configBlock: |-
              match ^.+\.vpn\.dzerv\.art\.$
              answer "{{ .Name }} 60 IN A 10.43.0.50"
              fallthrough
          - name: forward
            # AdGuard public DNS
            parameters: . https://dns.adguard-dns.com
            configBlock: |-
                 tls_servername dns.adguard-dns.com

      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: lameduck 10s
          - name: ready
          - name: rewrite
            parameters: name exact git.vpn.dzerv.art traefik.traefik.svc.cluster.local answer auto
          - name: kubernetes
            parameters: in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance

    prometheus:
      service:
        enabled: true
      monitor:
        enabled: true
