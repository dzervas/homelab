name: Staged Docker runner acceptance

# No push/PR trigger and no production labels: promotion is a separate explicit cutover
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: success runs normally; failure exits deliberately; cancellation waits for UI cancel
        required: false
        default: success
        type: choice
        options: [success, failure, cancellation]

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: k8s-canary-${{ matrix.arch }}
    # Cold image pulls and service/container setup consume this budget, especially on ARM64
    timeout-minutes: 30
    services:
      web:
        image: nginx:alpine
        # No published ports with iptables=false; use the Docker bridge service alias
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Verified job tools and external daemon socket
        run: |
          set -eu
          git --version
          tar --version
          node --version
          test -n "$DOCKER_HOST"
          docker version
          docker info
          docker buildx version
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://web/
      - name: Prepare local JavaScript and composite Actions
        run: |
          set -eu
          mkdir -p .runner-canary/js .runner-canary/composite
          cat > .runner-canary/js/action.yml <<'EOF'
          name: Node 24 acceptance
          description: Exercise the Runner JavaScript action runtime
          runs:
            using: node24
            main: index.js
          EOF
          cat > .runner-canary/js/index.js <<'EOF'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.versions.node.split('.')[0], '24');
          console.log(execFileSync('git', ['--version'], { encoding: 'utf8' }));
          console.log('RUNNER_JAVASCRIPT_PASS');
          EOF
          cat > .runner-canary/composite/action.yml <<'EOF'
          name: Composite acceptance
          description: Exercise the Runner composite action runtime
          runs:
            using: composite
            steps:
              - shell: bash
                run: |
                  set -eu
                  test -f .runner-canary/js/index.js
                  docker info >/dev/null
                  echo RUNNER_COMPOSITE_PASS
          EOF
      - uses: ./.runner-canary/js
      - uses: ./.runner-canary/composite
      - name: Docker-container Action
        uses: docker://alpine:3.23
        with:
          args: sh -ec 'test -f "$GITHUB_WORKSPACE/.runner-canary/js/index.js"; echo RUNNER_DOCKER_ACTION_PASS'
      - name: Deliberate lifecycle scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -eu
          case "${SCENARIO:-success}" in
            success) ;;
            failure)
              echo RUNNER_CANARY_FORCED_FAILURE
              exit 1
              ;;
            cancellation)
              echo RUNNER_CANARY_CANCEL_READY
              # Cancel in the Forgejo UI after BOTH architecture jobs reach this marker.
              # Allow 20 minutes for the slower architecture; the total 30-minute deadline still applies.
              remaining=120
              while [ "$remaining" -gt 0 ]; do
                sleep 10
                remaining=$((remaining - 1))
              done
              echo RUNNER_CANARY_CANCEL_INCONCLUSIVE_NOT_CANCELLED
              exit 1
              ;;
            *) echo RUNNER_CANARY_INVALID_SCENARIO; exit 1 ;;
          esac
      - name: Acceptance marker
        run: echo 'RUNNER_ACTIONS_CANARY_PASS ${{ matrix.arch }}'
      # For success/failure/cancel, collect each Pod completion/status and DinD termination,
      # then zero queue/worker Pods and no site-wide or project runner identities. Markers
      # are not lifecycle/storage proof. No-task/startup/API interruption remain unproved.
