name: Remote BuildKit build/publish canary

# Manual only; no production tag mutation or publisher cutover.
# Human prerequisite: standalone cold/restart/warm PASS on BOTH architectures in
# envs/forgejo-buildkit-canary, then apply the staged bidirectional runner/server policy.
# Set repository vars BUILDKIT_CANARY_AMD64_ENDPOINT=tcp://buildkit-amd64.forgejo-buildkit-canary.svc:1234
# and BUILDKIT_CANARY_ARM64_ENDPOINT=tcp://buildkit-arm64.forgejo-buildkit-canary.svc:1234.
# Human-only provisioning: secrets BUILDKIT_CANARY_CA, BUILDKIT_CANARY_CLIENT_CERT,
# BUILDKIT_CANARY_CLIENT_KEY (trusted canary client PEMs), forgejo_token (package write).
# Separate canary names leave docker.yaml's production endpoints and credentials untouched.
# Never use production workers here. Confirm certificate SANs, trust and expiry.
# The probe's 2Gi PVCs are bounded tests, not production sizing; measure df/BuildKit du
# before and after real builds, and stop if headroom is insufficient rather than enlarging blindly.
# Registry layer cache uses the existing Forgejo login, with separate canary-cache-ARCH tags.
# Dispatch on the same commit twice; require cache export/import logs and original RUN cache hits.
# Local worker state can mask registry restore: fresh-state builder proof is a separate live gate.
# Do not delete existing PVCs for that test. Keep standalone cold/restart/warm evidence separately.
# Test partial rerun: rerun a failed architecture + publish, then publish-only; successful
# sibling tags remain addressable by run ID, irrespective of each job's run_attempt.
# Record worker nodeSelector/native arch and lack of emulation alongside execution logs.
# Keep ephemeral registration; cancellation's delayed eventual cleanup is accepted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-publish-canary
  cancel-in-progress: false

env:
  REGISTRY: git.vpn.dzerv.art
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    runs-on: k8s-canary-${{ matrix.platform.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            endpoint: BUILDKIT_CANARY_AMD64_ENDPOINT
          - arch: arm64
            endpoint: BUILDKIT_CANARY_ARM64_ENDPOINT
    env:
      DOCKER_CONFIG: /tmp/docker-config
      BUILDKIT_ENDPOINT: ${{ vars[matrix.platform.endpoint] }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.forgejo_token }}
      - name: Require authenticated standalone canary endpoint
        env:
          BUILDKIT_CA: ${{ secrets.BUILDKIT_CANARY_CA }}
          BUILDKIT_CLIENT_CERT: ${{ secrets.BUILDKIT_CANARY_CLIENT_CERT }}
          BUILDKIT_CLIENT_KEY: ${{ secrets.BUILDKIT_CANARY_CLIENT_KEY }}
        run: |
          set -eu
          : "${BUILDKIT_CA:?Missing BUILDKIT_CA}"
          : "${BUILDKIT_CLIENT_CERT:?Missing BUILDKIT_CLIENT_CERT}"
          : "${BUILDKIT_CLIENT_KEY:?Missing BUILDKIT_CLIENT_KEY}"
          test "$BUILDKIT_ENDPOINT" = "tcp://buildkit-$ARCH.forgejo-buildkit-canary.svc:1234"
      - uses: https://github.com/docker/setup-buildx-action@v3
        id: buildx
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDKIT_CANARY_CA }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDKIT_CANARY_CLIENT_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDKIT_CANARY_CLIENT_KEY }}
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_ENDPOINT }}
          cache-binary: false
      - name: Add uncached native tool execution proof to canary only
        run: |
          set -eu
          # Keep the real Dockerfile intact, including download and npm install layers.
          # Its final stage is Node/Debian, USER 10001, with kagi + supergateway on PATH;
          # it is not a scratch/Alpine image and kagi mcp would require a session token.
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const source = readFileSync('docker/kagi-mcp/Dockerfile', 'utf8');
          const stage = 'FROM node:24-trixie-slim\n';
          if (source.split(stage).length !== 2) throw new Error('Review changed Kagi final stage');
          writeFileSync('/tmp/kagi-canary.Dockerfile', source.replace(stage, 'FROM node:24-trixie-slim AS canary-image\n'));
          JS
          cat >> /tmp/kagi-canary.Dockerfile <<'EOF'

          FROM canary-image AS canary-proof
          ARG TARGETARCH
          RUN node -e 'const a=process.env.TARGETARCH; if(process.arch!==({amd64:"x64",arm64:"arm64"})[a])process.exit(1); console.log("KAGI_NODE_ARCH_PASS",a,process.arch)' \
              && case "$TARGETARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac \
              && kagi --version \
              && supergateway --version \
              && echo "KAGI_NATIVE_TOOLS_PASS $TARGETARCH"
          EOF
      - uses: https://github.com/docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/kagi-mcp
          file: /tmp/kagi-canary.Dockerfile
          target: canary-proof
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          pull: true
          # Always execute the proof, while allowing original download/npm RUN cache hits.
          no-cache-filters: canary-proof
          # Never overwrite production cache-* refs; uncached proof still executes on every build.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ forgejo.repository }}/kagi-mcp:canary-cache-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ forgejo.repository }}/kagi-mcp:canary-cache-${{ matrix.platform.arch }},mode=max,oci-mediatypes=true,image-manifest=true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ forgejo.repository }}/kagi-mcp:canary-build-${{ forgejo.run_id }}-${{ matrix.platform.arch }}

  publish:
    needs: build
    runs-on: k8s-canary-amd64
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: /tmp/docker-config
      # Prove registry-only operation even on a job toolchain with a DinD sidecar.
      DOCKER_HOST: unix:///tmp/build-publish-canary-no-daemon.sock
      RUN_ID: ${{ forgejo.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No setup-buildx: imagetools uses only the bundled CLI plugin and registry.
      - run: docker buildx version
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.forgejo_token }}
      - name: Verify immutable sibling platforms and publish canary index only
        # Forgejo permits the env context in step env, not job env.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ forgejo.repository }}/kagi-mcp
        run: node .forgejo/build-publish-canary.mjs
      # Human gates: retain registry/tag digest logs, both uncached native tool PASS logs,
      # warm original-layer cache logs, partial-rerun proof and eventual ephemeral cleanup.
      # Set retention for run tags but preserve canary-cache-amd64/arm64; never mutate latest or promote here.
