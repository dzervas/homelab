name: Publish images

on:
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/docker.yaml
      - docker/affine/**
      - docker/kagi-mcp/**
      - docker/openclaw/**

# Disable the Woodpecker publisher at cutover; it writes the same latest tags.
concurrency:
  group: publish-images-main
  cancel-in-progress: false

permissions:
  contents: read

# Job toolchain must supply Node, Git, tar, Docker CLI and its bundled Buildx plugin.
# Build-only variables: BUILDKIT_AMD64_ENDPOINT / BUILDKIT_ARM64_ENDPOINT (tcp://certificate-hostname:port).
# Publish needs only forgejo_token (package write); builds also need
# BUILDKIT_CA, BUILDKIT_CLIENT_CERT and BUILDKIT_CLIENT_KEY.
# Remote workers must persist their BuildKit state for layer caching across job Pods.
env:
  REGISTRY: git.vpn.dzerv.art
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  changes:
    runs-on: k8s
    outputs:
      # Missing/unavailable push history must rebuild all rather than skip images.
      images: ${{ forgejo.event.before && steps.filter.outcome == 'success' && steps.filter.outputs.changes || '["affine","kagi-mcp","openclaw"]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://github.com/dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          # Compare this branch's push range using Git, not the GitHub REST API.
          base: ${{ forgejo.ref }}
          token: ''
          filters: |
            affine:
              - '.forgejo/workflows/docker.yaml'
              - 'docker/affine/**'
            kagi-mcp:
              - '.forgejo/workflows/docker.yaml'
              - 'docker/kagi-mcp/**'
            openclaw:
              - '.forgejo/workflows/docker.yaml'
              - 'docker/openclaw/**'

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: k8s-${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        platform:
          - arch: amd64
            endpoint: BUILDKIT_AMD64_ENDPOINT
          - arch: arm64
            endpoint: BUILDKIT_ARM64_ENDPOINT
    env:
      DOCKER_CONFIG: /tmp/docker-config
      BUILDKIT_ENDPOINT: ${{ vars[matrix.platform.endpoint] }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.forgejo_token }}
      - name: Require authenticated BuildKit
        env:
          BUILDKIT_CA: ${{ secrets.BUILDKIT_CA }}
          BUILDKIT_CLIENT_CERT: ${{ secrets.BUILDKIT_CLIENT_CERT }}
          BUILDKIT_CLIENT_KEY: ${{ secrets.BUILDKIT_CLIENT_KEY }}
        run: |
          : "${BUILDKIT_CA:?Missing BUILDKIT_CA}"
          : "${BUILDKIT_CLIENT_CERT:?Missing BUILDKIT_CLIENT_CERT}"
          : "${BUILDKIT_CLIENT_KEY:?Missing BUILDKIT_CLIENT_KEY}"
          case "$BUILDKIT_ENDPOINT" in
            tcp://*) ;;
            *) echo 'Configure the architecture-specific BUILDKIT endpoint'; exit 1 ;;
          esac
      - uses: https://github.com/docker/setup-buildx-action@v3
        id: buildx
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDKIT_CA }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDKIT_CLIENT_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDKIT_CLIENT_KEY }}
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_ENDPOINT }}
          cache-binary: false
      - uses: https://github.com/docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/${{ matrix.image }}
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          pull: true
          # OpenClaw's latest CLI downloads must refresh on every rebuild.
          no-cache: ${{ matrix.image == 'openclaw' }}
          provenance: false
          sbom: false
          # Stable within a run so partial reruns can reuse successful sibling builds.
          tags: ${{ env.REGISTRY }}/${{ forgejo.repository }}/${{ matrix.image }}:build-${{ forgejo.run_id }}-${{ matrix.platform.arch }}

  publish:
    needs: [changes, build]
    if: needs.changes.outputs.images != '[]'
    runs-on: k8s
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DOCKER_CONFIG: /tmp/docker-config
    steps:
      # Use the plugin bundled with the Docker CLI toolchain, not setup-buildx:
      # that action creates/boots a builder even though imagetools is registry-only.
      - name: Require Buildx CLI
        run: docker buildx version
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.forgejo_token }}
      - name: Publish multi-architecture latest tag
        # Configure registry retention for build-* tags before enabling this workflow.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ forgejo.repository }}/${{ matrix.image }}
          BUILD_TAG: build-${{ forgejo.run_id }}
        run: |
          set -eu
          # Resolve both successful run-specific siblings before mutating latest.
          # Do not use run_attempt: partial reruns retain older successful siblings.
          AMD64_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$BUILD_TAG-amd64" --format '{{.Manifest.Digest}}')
          ARM64_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$BUILD_TAG-arm64" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest"
