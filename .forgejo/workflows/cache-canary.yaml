name: Actions cache canary

# Native k8s-canary cache is staged enabled; none of these live gates has been proved by rendering.
# After user deployment and publishing this workflow, use a unique public generation (e.g. gate-20261013a):
# fj actions dispatch cache-canary.yaml main -I generation=gate-20261013a -I mode=seed
# Wait for BOTH arches; repeat with -I mode=restore to prove exact bytes from fresh one-job Pods.
# Dispatch two restores concurrently with the SAME generation; require distinct owning proxy IPs per arch.
# kubectl -n forgejo rollout restart statefulset/forgejo-runner-cache
# kubectl -n forgejo rollout status statefulset/forgejo-runner-cache --timeout=5m
# Then repeat restore; never delete the cache PVC or rotate its signing identity for this gate.
# In a SECOND repository containing this workflow: fj actions dispatch cache-canary.yaml main
#   --repo OWNER/SECOND_REPO -I generation=gate-20261013a -I mode=probe
# Isolation proof requires a prior exact restore in the source repo with the SAME logged version.
# HTTP lookup errors are INCONCLUSIVE, never isolation passes; SDK missing output alone proves nothing.
# File checks below do not prove shared-Pod network isolation; that remains a separate required live gate.
on:
  workflow_dispatch:
    inputs:
      generation:
        description: Unique public test key (reuse for restore and cross-repository probe)
        required: true
        type: string
      mode:
        description: seed requires miss; restore requires exact hit; probe requires cross-repository miss
        required: true
        type: choice
        options: [seed, restore, probe]

permissions:
  contents: read

# Allow same-key concurrent restores to test separate owning proxies; finish seed before dispatching restores.
jobs:
  cache:
    runs-on: k8s-canary-${{ matrix.arch }}
    # Cold image pulls count toward the deadline, as in the accepted runner canary.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GENERATION: ${{ inputs.generation }}
      MODE: ${{ inputs.mode }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner-only credential paths absent in job and Docker helper
        run: |
          set -eu
          # Presence checks only: never read credentials or dump process/container environments.
          test -z "${REGISTRATION_TOKEN:-}"
          test "${DOCKER_CONFIG:-}" != /run/secrets/registry-auth
          for path in /runner-state/.runner /run/secrets/registry-auth/config.json /run/secrets/forgejo-cache/cache-secret /runner-config/config.yaml; do
            test ! -e "$path"
          done
          docker run --rm alpine:3.23 sh -ec '
            test -z "${REGISTRATION_TOKEN:-}"
            test "${DOCKER_CONFIG:-}" != /run/secrets/registry-auth
            for path in /runner-state/.runner /run/secrets/registry-auth/config.json /run/secrets/forgejo-cache/cache-secret /runner-config/config.yaml; do
              test ! -e "$path"
            done
          '
          echo "CACHE_CANARY_CREDENTIAL_PATHS_PASS arch=$ARCH"
      - name: Validate owning proxy and exact candidate lookup
        id: lookup
        run: |
          case "$GENERATION" in
            ''|*[!a-zA-Z0-9_-]*) echo 'Use a public alphanumeric generation key'; exit 1 ;;
          esac
          test "${#GENERATION}" -le 48
          case "$MODE" in seed|restore|probe) ;; *) exit 1 ;; esac
          test ! -e .cache-canary
          mkdir .cache-canary
          # Print only the non-secret destination, never tokens or signed cache metadata.
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          try {
            const base = new URL(process.env.ACTIONS_CACHE_URL);
            const podIP = process.env.FORGEJO_RUNNER_POD_IP;
            if (!podIP || base.hostname.replace(/^\[|\]$/g, '') !== podIP ||
                base.port !== '4002' || base.protocol !== 'http:' || base.username || base.password) {
              throw new Error('Cache URL is not the owning Runner Pod IP on proxy port 4002');
            }
            console.log('Owning proxy:', base.origin);
            if (!process.env.ACTIONS_RUNTIME_TOKEN || process.env.ACTIONS_CACHE_SERVICE_V2) {
              throw new Error('Expected authenticated Runner v13.2 legacy cache API');
            }
            // actions/cache v4's @actions/cache 4.1.0 cacheUtils.getCacheVersion:
            // literal input path | getCompressionMethod() | salt 1.0 (Linux, no cross-OS archive).
            // https://github.com/actions/cache/blob/v4/package-lock.json
            const zstd = spawnSync('zstd', ['--quiet', '--version'], { encoding: 'utf8' });
            const compression = ((zstd.stdout || '') + (zstd.stderr || '')).trim()
              ? 'zstd-without-long' : 'gzip';
            if (process.platform !== 'linux') throw new Error('Expected Linux cache SDK version');
            const version = createHash('sha256').update(`.cache-canary|${compression}|1.0`).digest('hex');
            const key = `forgejo-cache-canary-${process.env.ARCH}-${process.env.GENERATION}`;
            // Keep the owning run-ID path, exactly as the legacy SDK's getCacheEntry does.
            const url = new URL(`${base.href}_apis/artifactcache/cache?keys=${encodeURIComponent(key)}&version=${version}`);
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`,
                Accept: 'application/json;api-version=6.0-preview.1',
              },
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
            });
            let result;
            if (response.status === 204) {
              result = 'MISS';
            } else if (response.status === 200) {
              const entry = await response.json();
              if (entry.cacheKey !== key || !entry.archiveLocation) throw new Error('Lookup did not return an exact entry');
              result = 'HIT';
            } else {
              throw new Error(`Exact cache lookup HTTP ${response.status}`);
            }
            console.log(`CACHE_CANARY_LOOKUP_${result} key=${key} version=${version} http=${response.status}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `result=${result}\n`);
          } catch {
            // Do not print exceptions: fetch diagnostics can include signed URLs or tokens.
            console.error('CACHE_CANARY_PROBE_INCONCLUSIVE: owning proxy or exact key/version lookup failed');
            process.exitCode = 1;
          }
          JS
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .cache-canary
          # Intentionally identical across repositories to exercise server-side repository isolation.
          key: forgejo-cache-canary-${{ matrix.arch }}-${{ inputs.generation }}
      - name: Assert expected hit and exact bytes
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          LOOKUP_RESULT: ${{ steps.lookup.outputs.result }}
        run: |
          if [ "$MODE" = restore ]; then
            test "$LOOKUP_RESULT" = HIT
            test "$CACHE_HIT" = true
            test -f .cache-canary/sentinel
            expected=$(printf 'forgejo-cache-canary:%s:%s\n' "$ARCH" "$GENERATION" | sha256sum | cut -d ' ' -f 1)
            actual=$(sha256sum .cache-canary/sentinel | cut -d ' ' -f 1)
            test "$actual" = "$expected"
            echo "CACHE_CANARY_RESTORE_PASS arch=$ARCH generation=$GENERATION checksum=$actual"
          else
            # A genuine HTTP 204 on the actual candidate is required, not an unset SDK output.
            if [ "$LOOKUP_RESULT" != MISS ]; then
              echo 'CACHE_CANARY_PROBE_INCONCLUSIVE: no affirmative exact lookup miss'
              exit 1
            fi
            test "$CACHE_HIT" != true
            test ! -e .cache-canary/sentinel
            if [ "$MODE" = seed ]; then
              printf 'forgejo-cache-canary:%s:%s\n' "$ARCH" "$GENERATION" > .cache-canary/sentinel
            else
              echo "CACHE_CANARY_ISOLATION_PASS arch=$ARCH generation=$GENERATION"
            fi
          fi
      - uses: actions/cache/save@v4
        if: inputs.mode == 'seed'
        with:
          path: .cache-canary
          key: forgejo-cache-canary-${{ matrix.arch }}-${{ inputs.generation }}
      - name: Seed requested (restore is the proof of persistence)
        if: inputs.mode == 'seed'
        run: echo "CACHE_CANARY_SEED_REQUESTED arch=$ARCH generation=$GENERATION"
