# Rootful OCI inside gVisor; host means the VIRTUAL Pod network, never host Linux
root = "/var/lib/buildkit"
insecure-entitlements = []

[grpc]
  address = ["tcp://0.0.0.0:1234"]
  [grpc.tls]
    cert = "/tls/tls.crt"
    key = "/tls/tls.key"
    ca = "/tls/ca.crt"

[cdi]
  disabled = true

[worker.oci]
  enabled = true
  rootless = false
  snapshotter = "native"
  noProcessSandbox = false
  networkMode = "host"
  max-parallelism = 1
  gc = true
  reservedSpace = "256MB"
  maxUsedSpace = "1GB"
  minFreeSpace = "512MB"

[worker.containerd]
  enabled = false

[history]
  maxAge = 86400
  maxEntries = 10
