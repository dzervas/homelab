when:
  - event: push
    branch: main
    path:
      include:
        - .woodpecker/docker.yaml
        - .woodpecker/docker-build.yaml
        - docker/${image}/**
      on_empty: false

matrix:
  image: [affine, kagi-mcp, openclaw]

# Native dependencies wait for all selected build axes; Woodpecker has no workflow sub-calls.
depends_on: [docker-build]
skip_clone: true
concurrency:
  limit: 1
  group: docker

steps:
  - name: publish
    image: mplatform/manifest-tool:v2.2.2
    directory: /
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    # Kubernetes expands $(FORGEJO_TOKEN) from the step secret; the scratch image needs no shell.
    entrypoint:
      - /manifest-tool
      - --username=${CI_REPO_OWNER}
      - --password=$(FORGEJO_TOKEN)
      - push
      - --type=oci
      - from-args
      - --platforms=linux/amd64,linux/arm64
      - --template=git.vpn.dzerv.art/${CI_REPO}/${image}:build-${CI_PIPELINE_NUMBER}-ARCH
      - --target=git.vpn.dzerv.art/${CI_REPO}/${image}:latest
      - --tags=build-${CI_PIPELINE_NUMBER}
